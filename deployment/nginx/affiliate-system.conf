server {
    listen 80;
    listen [::]:80;
    server_name affiliate.yourdomain.com; # Ganti dengan domain Anda
    root /var/www/affiliate-system/public;

    # Redirect all HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    index index.php index.html;
    charset utf-8;

    # Max upload body size
    client_max_body_size 20M;

    # Security Headers (copy deployment/nginx/racunin-security-headers.conf to /etc/nginx/snippets/)
    include /etc/nginx/snippets/racunin-security-headers.conf;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Logging
    access_log /var/log/nginx/affiliate_access.log;
    error_log  /var/log/nginx/affiliate_error.log error;

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # High performance static asset caching (Vite compiled builds, images, fonts)
    location ~* \.(?:css|js|woff2|woff|ttf|svg|jpg|jpeg|gif|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        include /etc/nginx/snippets/racunin-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock; # Sesuaikan versi PHP (misal php8.3-fpm atau 127.0.0.1:9000)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI Buffers for high traffic
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Health check bypass logging
    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

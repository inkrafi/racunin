[program:affiliate-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/affiliate-system/artisan queue:work database --sleep=2 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/affiliate-system/storage/logs/worker.log
stopwaitsecs=3600

[program:affiliate-scheduler]
command=php /var/www/affiliate-system/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/affiliate-system/storage/logs/scheduler.log
stopwaitsecs=60
